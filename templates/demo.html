<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ repo_name }}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; color: #1a1a1a; }
    h1 { margin-bottom: 0.25rem; }
    .caption { color: #666; margin-top: 0; margin-bottom: 2rem; }
    form { display: flex; gap: 0.5rem; margin-bottom: 2rem; flex-wrap: wrap; }
    form input { flex: 1; padding: 0.5rem; font-size: 1rem; min-width: 150px; }
    form button { padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #ddd; }
    .empty { color: #666; font-style: italic; }
  </style>
</head>
<body>
  <h1>{{ repo_name }}</h1>
  <p class="caption">{{ tech_stack }}</p>

  {% if users %}
  <table>
    <thead>
      <tr><th>Name</th><th>Email</th><th>Created On</th></tr>
    </thead>
    <tbody>
      {% for user in users %}
      <tr>
        <td>{{ user["name"] }}</td>
        <td>{{ user["email"] }}</td>
        <td>{{ user["created_at"] }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
  {% else %}
  <p class="empty">No users yet.</p>
  {% endif %}
</body>
</html>
